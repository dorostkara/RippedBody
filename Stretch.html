<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stretch Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --lower: #0e8a7a; --upper: #3a7ae8; --cycling: #2daa6e; --rest: #7c5cbf; --deload: #c47b1a;
    --bg: #f7f4ef; --card: #ffffff; --text: #1a1a1a; --muted: #888; --border: #e0dbd3;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px 60px; }

  .header { text-align: center; margin-bottom: 20px; }
  .header-label { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .header h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(44px,12vw,68px); line-height: 0.9; }
  .header h1 span { transition: color 0.3s; }
  .meta-row { display: flex; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .meta-pill { border-radius: 100px; padding: 5px 14px; font-size: 12px; font-weight: 500; color: #fff; }

  .tabs { display: flex; gap: 5px; margin-bottom: 12px; justify-content: center; flex-wrap: wrap; }
  .tab { flex: 1; min-width: 60px; max-width: 100px; padding: 8px 4px; border-radius: 50px; border: 2px solid transparent; background: var(--card); font-family: 'DM Sans', sans-serif; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s; line-height: 1.3; text-align: center; }
  .tab.lower   { color: var(--lower);   border-color: var(--lower); }
  .tab.upper   { color: var(--upper);   border-color: var(--upper); }
  .tab.cycling { color: var(--cycling); border-color: var(--cycling); }
  .tab.rest    { color: var(--rest);    border-color: var(--rest); }
  .tab.deload  { color: var(--deload);  border-color: var(--deload); }
  .tab.lower.active   { background: var(--lower);   color: #fff; }
  .tab.upper.active   { background: var(--upper);   color: #fff; }
  .tab.cycling.active { background: var(--cycling); color: #fff; }
  .tab.rest.active    { background: var(--rest);    color: #fff; }
  .tab.deload.active  { background: var(--deload);  color: #fff; }
  .tab:disabled { opacity: 0.4; cursor: not-allowed; }

  .timer-sticky { position: sticky; top: 0; z-index: 50; padding-bottom: 10px; background: var(--bg); }
  .timer-section { border-radius: 20px; padding: 16px 16px 14px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.15); transition: background 0.3s; }
  .dot-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; min-height: 9px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: background 0.3s; }
  .dot.active { background: #fff; }
  .dot.done   { background: rgba(255,255,255,0.4); }
  .timer-label { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 1px; min-height: 13px; }
  .timer-label.switch-mode { color: #ffe082; }
  .timer-display { font-family: 'Bebas Neue', sans-serif; font-size: 76px; line-height: 1; color: #fff; letter-spacing: 3px; }
  .timer-display.switch-mode { color: #ffe082; }
  .timer-name { font-family: 'Bebas Neue', sans-serif; font-size: 19px; color: rgba(255,255,255,0.9); letter-spacing: 1px; margin: 2px 0 1px; min-height: 24px; }
  .timer-breath  { font-size: 11px; color: rgba(255,255,255,0.55); font-style: italic; min-height: 16px; margin-bottom: 1px; }
  .timer-repnote { font-size: 11px; color: rgba(255,255,255,0.75); font-weight: 600; min-height: 16px; margin-bottom: 1px; }
  .timer-warning { font-size: 10px; color: #ffe082; min-height: 14px; margin-bottom: 2px; padding: 0 8px; }
  .timer-progress { font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 8px; min-height: 14px; }
  .pbar-wrap { height: 4px; background: rgba(255,255,255,0.15); border-radius: 4px; margin-bottom: 12px; overflow: hidden; }
  .pbar-fill { height: 100%; border-radius: 4px; transition: width 1s linear; width: 0%; background: rgba(255,255,255,0.7); }
  .btn-row { display: flex; gap: 8px; justify-content: center; }
  .btn { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
  .btn:active { transform: scale(0.97); }
  .btn-primary   { background: #fff; }
  .btn-secondary { background: rgba(255,255,255,0.15); color: #fff; }
  .btn-danger    { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.65); }

  .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 4px; color: var(--muted); margin-bottom: 10px; padding-left: 2px; margin-top: 14px; }
  .ex-list { display: flex; flex-direction: column; gap: 7px; }
  .ex-card { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 11px 13px; display: flex; align-items: center; gap: 11px; position: relative; overflow: hidden; transition: border-color 0.2s, background 0.2s, opacity 0.4s, max-height 0.4s ease, padding 0.3s, margin 0.3s; max-height: 200px; }
  .ex-card.active-ex { border-color: transparent; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .ex-card.done-ex { opacity: 0; max-height: 0 !important; padding-top: 0; padding-bottom: 0; margin-bottom: 0; border-width: 0; }
  .ex-num { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--muted); min-width: 26px; flex-shrink: 0; }
  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-weight: 600; font-size: 0.87rem; line-height: 1.3; }
  .ex-note { font-size: 0.71rem; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .ex-repnote { font-size: 0.69rem; color: #c47b1a; margin-top: 2px; font-weight: 600; }
  .ex-warning { font-size: 0.67rem; color: #c47b00; margin-top: 3px; line-height: 1.4; background: #fff8ee; border-radius: 4px; padding: 2px 5px; }
  .ex-dur { font-size: 0.69rem; font-weight: 700; padding: 3px 7px; border-radius: 20px; white-space: nowrap; text-align: center; flex-shrink: 0; }
  .phase-divider { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); padding: 12px 2px 3px; font-weight: 600; }

  .done-overlay { display: none; position: fixed; inset: 0; background: rgba(247,244,239,0.97); flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 32px; }
  .done-overlay.show { display: flex; }
  .done-title { font-family: 'Bebas Neue', sans-serif; font-size: 68px; line-height: 1; margin-bottom: 10px; }
  .done-sub { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
</style>
</head>
<body>

<div class="header">
  <p class="header-label">Recovery</p>
  <h1>STRETCH<br><span id="dayLabel">LOWER</span></h1>
  <div class="meta-row">
    <span class="meta-pill" id="pillStretches"><strong>18</strong> Exercises</span>
    <span class="meta-pill" id="pillTime"><strong>~35</strong> Min</span>
  </div>
</div>

<div class="tabs">
  <button class="tab lower active" onclick="switchDay('lower')">🦵 Lower</button>
  <button class="tab upper"        onclick="switchDay('upper')">💪 Upper</button>
  <button class="tab cycling"      onclick="switchDay('cycling')">🚴 Cycling</button>
  <button class="tab rest"         onclick="switchDay('rest')">😴 Rest</button>
  <button class="tab deload"       onclick="switchDay('deload')">🔄 Deload</button>
</div>

<div class="timer-sticky">
  <div class="timer-section" id="timerSection">
    <div class="dot-row"       id="dotRow"></div>
    <div class="timer-label"   id="timerLabel">READY</div>
    <div class="timer-display" id="timerDisplay">—</div>
    <div class="timer-name"    id="timerName">Press Start</div>
    <div class="timer-breath"  id="timerBreath"></div>
    <div class="timer-repnote" id="timerRepNote"></div>
    <div class="timer-warning" id="timerWarning"></div>
    <div class="timer-progress" id="timerProgress"></div>
    <div class="pbar-wrap"><div class="pbar-fill" id="pbarFill"></div></div>
    <div class="btn-row">
      <button class="btn btn-primary"   id="btnStart" onclick="startTimer()">START</button>
      <button class="btn btn-secondary" id="btnPause" onclick="pauseTimer()" style="display:none">PAUSE</button>
      <button class="btn btn-danger"    onclick="resetTimer()">RESET</button>
    </div>
  </div>
</div>

<p class="section-title">Exercises</p>
<div class="ex-list" id="exList"></div>

<div class="done-overlay" id="doneOverlay">
  <div class="done-title" id="doneTitle">DONE!</div>
  <div class="done-sub">Great work. Sleep well 💤</div>
  <button class="btn btn-primary" onclick="resetTimer()" style="font-size:20px;padding:14px 36px;color:#333">RESTART</button>
</div>

<script>
const BREATH = 'Inhale 4 sec · Exhale 6–8 sec';

// ─── SHARED EXERCISE DEFINITIONS ─────────────────────────────────────────────
const EX = {
  // FOAM ROLL
  quads:        { name:'Quads',                            note:'Face down, roll hip to knee. Pause on knots',                                                                                                      dur:60, bilateral:true  },
  hamstrings_fr:{ name:'Hamstrings',                       note:'Cross ankle over other for more pressure',                                                                                                          dur:60, bilateral:true  },
  glutes_fr:    { name:'Glutes / Piriformis',              note:'Cover glute max, medius and piriformis. Cross leg over for deeper piriformis work. Extra attention left side if tight',                            dur:60, bilateral:true  },
  glutes_fr_lt: { name:'Glutes / Piriformis',              note:'Light pressure only. Cross leg over for piriformis. Breathe slowly',                                                                               dur:60, bilateral:true  },
  tfl_fr:       { name:'TFL — Front/Side of Hip',          note:'Focus on front/side of hip (TFL) — this influences IT band tension more than direct IT band rolling',                                             dur:60, bilateral:true  },
  calves_tib:   { name:'Calves + Tibialis (Roller Stick)', note:'Roller stick on calf first — slow deliberate rolls ankle to knee. Then foam roller on tibialis anterior — roll shin ankle to knee. Complete one side before switching', dur:60, bilateral:true },
  upper_back_fr:{ name:'Upper Back / Thoracic',            note:'Arms crossed over chest, roll mid-back. Pause on stiff segments',                                                                                  dur:60, bilateral:false },
  upper_back_gentle:{ name:'Upper Back',                   note:'Slow gentle roll, arms crossed. No need to pause hard on knots',                                                                                   dur:60, bilateral:false },
  lats_fr:      { name:'Lats',                             note:'Lie on side, roll from armpit to mid-back',                                                                                                        dur:60, bilateral:true  },
  quads_fr2:    { name:'Quads',                            note:'Face down, roll hip to knee. Biggest priority after cycling',                                                                                      dur:60, bilateral:true  },

  // MOBILITY / BAND
  thoracic_ext: { name:'Thoracic Extension',               note:'Upper back over foam roller, arms crossed. Hold and breathe deeply',                                                                              dur:60, bilateral:false },
  thoracic_ext_long:{ name:'Thoracic Extension',           note:'Upper back over foam roller, arms crossed. Take extra time today',                                                                                 dur:60, bilateral:false },
  shoulder_cars:{ name:'Shoulder CARs',                    note:'Standing, slow full circle of shoulder joint. 5 circles each direction each side. Stay within pain-free range',                                   dur:45, bilateral:true,  repnote:'5 circles each direction each side' },
  hip_cars:     { name:'Hip CARs',                         note:'Standing, slow full circle of hip joint. 5 circles each direction. FAI caution — gentle on internal rotation',                                    dur:30, bilateral:true,  repnote:'5 circles each direction each side' },
  ankle_cars:   { name:'Ankle CARs',                       note:'Seated or standing, slow full circle of ankle joint. 5 circles each direction each side',                                                         dur:30, bilateral:true,  repnote:'5 circles each direction each side' },
  band_pass:    { name:'Band Pass-Through',                note:'Arms straight, band from front to back overhead. Widen grip if uncomfortable',                                                                     dur:60, bilateral:false, repnote:'15–20 slow reps' },
  wall_slides:  { name:'Wall Slides',                      note:'Back flat against the wall, arms at 90°. Slide up keeping full contact. Avoid shrugging',                                                         dur:30, bilateral:false, repnote:'10 reps' },
  band_dist:    { name:'Band Distraction',                 note:'Loop band around wrist, step away, let band gently pull arm. Decompresses shoulder joint',                                                         dur:60, bilateral:true  },
  wall_ankle:   { name:'Wall Ankle Mobility',              note:'Foot 4 inches from wall, drive knee forward toward wall keeping heel flat. Improves dorsiflexion',                                                dur:45, bilateral:true,  repnote:'10 reps each side · hold 2s at wall' },
  stand_reach:  { name:'Stand & Reach',                    note:'One hand on hip, other arm extends up and back on a diagonal. Experiment with angles',                                                             dur:45, bilateral:true,  repnote:'6 reps each side · hold 5s at end range' },
  thor_rot:     { name:'Thoracic Rotation',                note:'Hips back toward heels, one hand extended forward, other behind neck. Rotate elbow down to floor then up to ceiling. Slow and controlled',       dur:45, bilateral:true,  repnote:'8 reps each side · pause 2s at top' },
  hip_90_mob:   { name:'90/90 Hip Mobility',               note:'Sit with front leg at 90° and back leg at 90°. Upright torso. Gently lean forward over front shin. FAI caution — internal rotation side only to comfortable range', dur:60, bilateral:true, breath:true },
  hip_90_rot:   { name:'90/90 Hip Rotation',               note:'Hips back toward heels, one hand extended forward, other behind neck. Rotate elbow down to floor then up toward ceiling',                        dur:60, bilateral:false, repnote:'8 reps each side · pause 2s at top' },

  // STATIC
  hip_flex1:    { name:'Hip Flexor Lunge — Round 1',       note:'Knee on floor, push hips forward, squeeze glute',                                                                                                  dur:60, bilateral:true,  breath:true },
  hip_flex2:    { name:'Hip Flexor Lunge — Round 2',       note:'Go deeper this time. Breathe fully into the stretch',                                                                                              dur:60, bilateral:true,  breath:true },
  hip_flex_r:   { name:'Hip Flexor Lunge',                 note:'Focus on breathing, no forcing today',                                                                                                             dur:60, bilateral:true,  breath:true },
  hip_flex_cyc1:{ name:'Hip Flexor Lunge — Round 1',       note:'Knee on floor, push hips forward, squeeze glute. Critical after cycling',                                                                         dur:60, bilateral:true,  breath:true },
  hip_flex_cyc2:{ name:'Hip Flexor Lunge — Round 2',       note:'Deeper on round 2 — critical after cycling. Really sink into it',                                                                                 dur:60, bilateral:true,  breath:true },
  chair_pigeon: { name:'Chair Pigeon',                     note:'Front shin on chair or bench, back leg extended. Brace core, bring chest forward until you feel stretch in front hip. Explore different angles',  dur:60, bilateral:true,  breath:true },
  ham_fold:     { name:'Hamstring Forward Fold',           note:'Legs straight, hinge from hips. Keep back flat',                                                                                                   dur:60, bilateral:false, breath:true },
  ham_fold_r:   { name:'Hamstring Forward Fold',           note:'Relax into it — no pushing today',                                                                                                                 dur:60, bilateral:false, breath:true },
  fig4:         { name:'Glutes Figure 4',                  note:'On back, cross ankle over opposite knee, pull toward chest',                                                                                       dur:60, bilateral:true,  breath:true },
  fig4_long:    { name:'Glutes Figure 4',                  note:'On back, cross ankle over opposite knee, pull toward chest',                                                                                       dur:90, bilateral:true,  breath:true },
  fig4_r:       { name:'Glutes Figure 4',                  note:'On back, breathe slowly. Let gravity do the work',                                                                                                dur:60, bilateral:true,  breath:true },
  butterfly:    { name:'Inner Thighs Butterfly',           note:'Soles together, gently press knees toward floor',                                                                                                   dur:60, bilateral:false, breath:true },
  slant_str:    { name:'Slant Board — Straight Knee',      note:'Both feet on board. Full posterior chain stretch — calf, hamstring and lower back simultaneously',                                                dur:60, bilateral:false },
  slant_bent:   { name:'Slant Board — Bent Knee',          note:'Targets soleus and Achilles. Adjust angle for comfortable stretch',                                                                               dur:60, bilateral:false  },
  slant_ham:    { name:'Slant Board — Hamstring',          note:'Stand on board, hinge forward from hips keeping back flat. Deeper hamstring stretch with posterior chain loaded',                                  dur:60, bilateral:false, breath:true },
  slant_bent_r: { name:'Slant Board — Bent Knee',          note:'Gentle Achilles recovery. Adjust angle for comfortable stretch',                                                                                  dur:60, bilateral:false  },
  quad_stand:   { name:'Standing Quad Stretch',            note:'Hold ankle behind you, knees together, stand tall',                                                                                                dur:45, bilateral:true  },
  open_book:    { name:'Open Book Stretch',                note:'Side lying, knees at 90°. Top arm sweeps open following your eyes. Keep knees stacked',                                                           dur:45, bilateral:true,  breath:true, repnote:'6 reps each side · hold 5s at end range · or sustained hold' },
  open_book_long:{ name:'Open Book Stretch',               note:'Side lying, knees at 90°. Top arm sweeps open following your eyes. Keep knees stacked',                                                           dur:60, bilateral:true,  breath:true, repnote:'6 reps each side · hold 5s at end range · or sustained hold' },
  pec_wall:     { name:'Pec Wall Stretch',                 note:'Arm at 45° on wall or doorframe, rotate body away gently. Safer angle for shoulder',                                                              dur:60, bilateral:true,  breath:true },
  cross_rear:   { name:'Cross-Body Rear Delt Stretch',     note:'Arm across chest at shoulder height, gently pull with other arm. Safe alternative to sleeper stretch',                                            dur:45, bilateral:true,  breath:true },
  bicep_door:   { name:'Doorway Bicep Stretch',            note:'Arm behind you at 45°, palm on wall, rotate body away gently',                                                                                    dur:45, bilateral:true  },
  lat_oh:       { name:'Lat Overhead Stretch',             note:'Arms overhead, clasp hands, lean slowly side to side',                                                                                             dur:60, bilateral:true,  breath:true },
  triceps_oh:   { name:'Triceps Overhead',                 note:'Elbow behind head, gently press down with other hand',                                                                                             dur:45, bilateral:true  },
  thread:       { name:'Thread the Needle',                note:'On all fours, slide one arm under body until shoulder touches floor',                                                                              dur:45, bilateral:true,  repnote:'8 reps each side · pause 3s at end range' },
  neck_side:    { name:'Neck Side Stretch',                note:'Ear toward shoulder, light hand pressure. Breathe slowly',                                                                                         dur:45, bilateral:true  },
  forearm_flex: { name:'Forearm Flexor Stretch',           note:'Arm straight, palm up, bend wrist down gently',                                                                                                   dur:30, bilateral:true  },
  forearm_ext:  { name:'Forearm Extensor Stretch',         note:'Arm straight, palm down, bend wrist down gently',                                                                                                  dur:30, bilateral:true  },
  cobra:        { name:'Cobra',                            note:'Toes down, hands under shoulders. Contract quads, shoulder blades down and back. Bring upper body forward and up — arms for guidance only',       dur:40, bilateral:false, repnote:'8 reps · hold 3s at top · lower slowly' },
  cat_cow:      { name:'Cat-Cow',                          note:'Continuous flowing movement. Arch on inhale, round on exhale',                                                                                     dur:60, bilateral:false, repnote:'12 reps · one full breath per rep' },
  childs_pose:  { name:"Child's Pose",                     note:'Arms extended, sink hips to heels. Slow deep breaths',                                                                                             dur:60, bilateral:false, breath:true },
  childs_long:  { name:"Child's Pose",                     note:'Arms extended, sink hips to heels. Stay here a little longer today',                                                                              dur:90, bilateral:false, breath:true },
  childs_r:     { name:"Child's Pose",                     note:'5 long slow breaths. Wind down',                                                                                                                   dur:60, bilateral:false, breath:true },
  spinal_twist: { name:'Supine Spinal Twist',              note:'On back, pull knee across body, arms out wide',                                                                                                    dur:60, bilateral:true,  breath:true },
  spinal_twist_long:{ name:'Supine Spinal Twist',          note:'On back, pull knee across body, arms out wide. Full deload wind-down',                                                                            dur:90, bilateral:true,  breath:true },
  spinal_twist_r:   { name:'Supine Spinal Twist',          note:'On back, pull knee across body. Let gravity do the work',                                                                                         dur:60, bilateral:true,  breath:true },
  chest_door:   { name:'Chest Doorway Stretch',            note:'Arms at 90°, gentle lean. Just open the chest',                                                                                                    dur:60, bilateral:false, breath:true },
  cobra_cyc:    { name:'Cobra',                            note:'Toes down, hands under shoulders. Contract quads, shoulder blades down and back. Bring upper body forward and up. Counteracts forward cycling lean', dur:40, bilateral:false, repnote:'8 reps · hold 3s at top · lower slowly' },
  band_pull:    { name:'Band Pull Apart',                  note:'Arms straight out front, pull band apart. Light band only',                                                                                        dur:45, bilateral:false, repnote:'12 reps' },
  band_ext_rot: { name:'Band External Rotation',           note:'Elbow at side at 90°, rotate forearm outward. Light band',                                                                                        dur:45, bilateral:true,  repnote:'12 reps each side' },
  cross_rear_d: { name:'Cross-Body Rear Delt Stretch',     note:'Arm across chest at shoulder height, gently pull with other arm',                                                                                 dur:45, bilateral:true,  breath:true },
  neck_ride:    { name:'Neck Side Stretch',                note:'Ear toward shoulder — relieves tension from riding posture',                                                                                       dur:45, bilateral:true  },
};

// ─── DAY DEFINITIONS ─────────────────────────────────────────────────────────
const DAYS = {

  lower: {
    label:'LOWER', color:'#0e8a7a', time:'~35', phases:[
      { phase:'🔥 Foam Roll', stretches:[
        EX.quads, EX.hamstrings_fr, EX.glutes_fr, EX.tfl_fr, EX.calves_tib,
      ]},
      { phase:'🧘 Static & Mobility', stretches:[
        EX.band_pass,
        EX.stand_reach,
        EX.hip_flex1,
        EX.chair_pigeon,
        EX.ham_fold,
        EX.fig4,
        EX.hip_90_mob,
        EX.butterfly,
        EX.slant_str,
        EX.slant_bent,
        EX.slant_ham,
        EX.hip_90_rot,
        EX.hip_cars,
        EX.ankle_cars,
        EX.wall_ankle,
        EX.quad_stand,
        EX.thoracic_ext,
        EX.thor_rot,
        EX.cobra,
        EX.cat_cow,
        EX.childs_pose,
      ]},
    ]
  },

  upper: {
    label:'UPPER', color:'#3a7ae8', time:'~28', phases:[
      { phase:'🔥 Foam Roll', stretches:[
        EX.upper_back_fr, EX.lats_fr,
      ]},
      { phase:'🏃 Mobility / Band Work', stretches:[
        EX.thoracic_ext,
        EX.shoulder_cars,
        EX.stand_reach,
        EX.band_pass,
        EX.wall_slides,
        EX.band_dist,
      ]},
      { phase:'🧘 Static Stretches', stretches:[
        EX.open_book,
        EX.pec_wall,
        EX.cross_rear,
        EX.bicep_door,
        EX.lat_oh,
        EX.triceps_oh,
        EX.thread,
        EX.neck_side,
        EX.forearm_flex,
        EX.forearm_ext,
        EX.cobra,
        EX.cat_cow,
        EX.childs_pose,
        EX.spinal_twist,
      ]},
    ]
  },

  cycling: {
    label:'CYCLING', color:'#2daa6e', time:'~38', phases:[
      { phase:'🔥 Foam Roll', stretches:[
        EX.quads_fr2, EX.calves_tib, EX.tfl_fr, EX.upper_back_fr, EX.glutes_fr,
      ]},
      { phase:'🧘 Static & Mobility', stretches:[
        EX.thoracic_ext,
        EX.shoulder_cars,
        EX.stand_reach,
        EX.band_pass,
        EX.hip_flex_cyc1,
        EX.chair_pigeon,
        EX.ham_fold,
        EX.slant_str,
        EX.slant_bent,
        EX.slant_ham,
        EX.hip_90_rot,
        EX.hip_cars,
        EX.ankle_cars,
        EX.wall_ankle,
        EX.fig4,
        EX.neck_ride,
        EX.thor_rot,

// ─── STATE ────────────────────────────────────────────────────────────────────
let currentDay = localStorage.getItem('stretchDay') || 'lower';
let steps=[], stepIdx=0, timeLeft=0, running=false, interval=null;
let wakeLock=null, audioUnlocked=false;

// ─── WAKE LOCK ────────────────────────────────────────────────────────────────
async function requestWakeLock() {
  try { if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); } catch(e){}
}
async function releaseWakeLock() {
  try { if(wakeLock){ await wakeLock.release(); wakeLock=null; } } catch(e){}
}
document.addEventListener('visibilitychange', async()=>{
  if(running && document.visibilityState==='visible') await requestWakeLock();
});

// ─── AUDIO ────────────────────────────────────────────────────────────────────
let audioCtx;
function getAudio() {
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq,dur,type,vol) {
  try {
    const ctx=getAudio(),osc=ctx.createOscillator(),g=ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type=type||'sine'; osc.frequency.setValueAtTime(freq,ctx.currentTime);
    g.gain.setValueAtTime(vol||0.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime+dur);
  } catch(e){}
}
function unlockAudio() {
  if(audioUnlocked) return;
  try {
    const ctx=getAudio(),buf=ctx.createBuffer(1,1,22050),src=ctx.createBufferSource();
    src.buffer=buf; src.connect(ctx.destination); src.start(0); audioUnlocked=true;
  } catch(e){}
}
function playStartBeeps(cb) {
  beep(660,0.12,'sine',0.28);
  setTimeout(()=>beep(660,0.12,'sine',0.28),300);
  setTimeout(()=>{ beep(880,0.2,'square',0.32); if(cb) setTimeout(cb,250); },600);
}
function playCountdown() { beep(660,0.08,'sine',0.2); }
function playDone() { beep(880,0.1); setTimeout(()=>beep(1100,0.1),120); setTimeout(()=>beep(1320,0.35),240); }

// ─── SPEECH ───────────────────────────────────────────────────────────────────
function speak(text,rate) {
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=rate||1.0; u.pitch=1.0; u.volume=1.0;
  window.speechSynthesis.speak(u);
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function getDayData() { return DAYS[currentDay]; }

function updatePills() {
  const data=getDayData(), col=data.color;
  let count=0; data.phases.forEach(p=>count+=p.stretches.length);
  document.getElementById('pillStretches').innerHTML=`<strong>${count}</strong> Exercises`;
  document.getElementById('pillStretches').style.background=col;
  document.getElementById('pillTime').innerHTML=`<strong>${data.time}</strong> Min`;
  document.getElementById('pillTime').style.background=col;
}

// ─── SWITCH DAY ───────────────────────────────────────────────────────────────
function switchDay(day) {
  if(running) return;
  currentDay=day;
  localStorage.setItem('stretchDay',day);
  const data=getDayData(), col=data.color;
  document.getElementById('dayLabel').textContent=data.label;
  document.getElementById('dayLabel').style.color=col;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelector('.tab.'+day).classList.add('active');
  document.getElementById('timerSection').style.background=col;
  document.getElementById('btnStart').style.color=col;
  document.getElementById('doneTitle').style.color=col;
  updatePills(); buildList(); resetTimer(true);
}

// ─── BUILD LIST ───────────────────────────────────────────────────────────────
function buildList() {
  const data=getDayData(), col=data.color;
  let si=0;
  const html=data.phases.map(p=>{
    const rows=p.stretches.map(s=>{
      const i=si++;
      const dl=s.bilateral?`${s.dur}s × 2`:`${s.dur}s`;
      const warn=s.warning?`<div class="ex-warning">⚠️ ${s.warning}</div>`:'';
      const repn=s.repnote?`<div class="ex-repnote">🎯 ${s.repnote}</div>`:'';
      return `<div class="ex-card" id="excard-${i}">
        <div class="ex-num">${String(i+1).padStart(2,'0')}</div>
        <div class="ex-info">
          <div class="ex-name">${s.name}</div>
          <div class="ex-note">${s.note}</div>
          ${repn}${warn}
        </div>
        <div class="ex-dur" style="background:${col}20;color:${col}">${dl}</div>
      </div>`;
    }).join('');
    return `<div class="phase-divider">${p.phase}</div>${rows}`;
  }).join('');
  document.getElementById('exList').innerHTML=html;
  let c=0; data.phases.forEach(p=>c+=p.stretches.length);
  buildDots(c);
}

// ─── DOTS ─────────────────────────────────────────────────────────────────────
function buildDots(count) {
  document.getElementById('dotRow').innerHTML=
    Array.from({length:count},(_,i)=>`<div class="dot" id="dot${i}"></div>`).join('');
}
function updateDots(sNum) {
  let c=0; getDayData().phases.forEach(p=>c+=p.stretches.length);
  for(let i=0;i<c;i++){
    const d=document.getElementById('dot'+i); if(!d) continue;
    d.className='dot'+(i<sNum?' done':i===sNum?' active':'');
  }
}

// ─── HIGHLIGHT + COLLAPSE ─────────────────────────────────────────────────────
function highlightCard(sNum) {
  const col=getDayData().color;
  let c=0; getDayData().phases.forEach(p=>c+=p.stretches.length);
  for(let i=0;i<c;i++){
    const card=document.getElementById('excard-'+i); if(!card) continue;
    card.classList.remove('active-ex','done-ex'); card.style.borderLeftColor='';
    if(i<sNum) card.classList.add('done-ex');
  }
  const ac=document.getElementById('excard-'+sNum);
  if(ac){
    ac.classList.add('active-ex'); ac.style.borderLeftColor=col;
    setTimeout(()=>ac.scrollIntoView({behavior:'smooth',block:'nearest'}),150);
  }
}

// ─── FLATTEN STEPS ────────────────────────────────────────────────────────────
function flattenSteps() {
  const all=[];
  getDayData().phases.forEach(p=>p.stretches.forEach(s=>all.push(s)));
  const out=[];
  all.forEach((s,i)=>{
    if(s.bilateral){
      out.push({ type:'announce',        name:s.name, breath:!!s.breath, warning:s.warning||null, repnote:s.repnote||null, stretchNum:i });
      out.push({ type:'hold',            name:s.name, breath:!!s.breath, warning:s.warning||null, repnote:s.repnote||null, dur:s.dur, stretchNum:i });
      out.push({ type:'switch_announce', name:s.name, stretchNum:i });
      out.push({ type:'hold',            name:s.name, breath:!!s.breath, warning:s.warning||null, repnote:s.repnote||null, dur:s.dur, stretchNum:i, isSecondSide:true });
    } else {
      out.push({ type:'announce', name:s.name, breath:!!s.breath, warning:s.warning||null, repnote:s.repnote||null, stretchNum:i });
      out.push({ type:'hold',     name:s.name, breath:!!s.breath, warning:s.warning||null, repnote:s.repnote||null, dur:s.dur, stretchNum:i });
    }
  });
  return out;
}

// ─── TIMER CONTROLS ───────────────────────────────────────────────────────────
function startTimer() {
  unlockAudio();
  try{ getAudio().resume(); }catch(e){}
  if(running) return;
  steps=flattenSteps(); stepIdx=0; running=true;
  requestWakeLock();
  document.querySelectorAll('.tab').forEach(t=>t.disabled=true);
  document.getElementById('btnStart').style.display='none';
  document.getElementById('btnPause').style.display='inline-block';
  processStep();
  interval=setInterval(tick,1000);
}

function pauseTimer() {
  if(running){ clearInterval(interval); running=false; releaseWakeLock(); document.getElementById('btnPause').textContent='RESUME'; }
  else { running=true; requestWakeLock(); document.getElementById('btnPause').textContent='PAUSE'; interval=setInterval(tick,1000); }
}

function resetTimer(silent) {
  clearInterval(interval); running=false; stepIdx=0; steps=[];
  releaseWakeLock();
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.tab').forEach(t=>t.disabled=false);
  document.getElementById('btnStart').style.display='inline-block';
  document.getElementById('btnPause').style.display='none';
  document.getElementById('btnPause').textContent='PAUSE';
  document.getElementById('timerLabel').textContent='READY';
  document.getElementById('timerLabel').className='timer-label';
  document.getElementById('timerDisplay').textContent='—';
  document.getElementById('timerDisplay').className='timer-display';
  document.getElementById('timerName').textContent='Press Start';
  document.getElementById('timerBreath').textContent='';
  document.getElementById('timerRepNote').textContent='';
  document.getElementById('timerWarning').textContent='';
  document.getElementById('timerProgress').textContent='';
  document.getElementById('pbarFill').style.width='0%';
  document.getElementById('doneOverlay').classList.remove('show');
  document.querySelectorAll('.ex-card').forEach(c=>{ c.classList.remove('active-ex','done-ex'); c.style.borderLeftColor=''; });
  updateDots(-1);
}

// ─── PROCESS STEP ─────────────────────────────────────────────────────────────
function processStep() {
  if(stepIdx>=steps.length){ finishSession(); return; }
  const step=steps[stepIdx];
  let total=0; getDayData().phases.forEach(p=>total+=p.stretches.length);

  updateDots(step.stretchNum);
  highlightCard(step.stretchNum);
  document.getElementById('timerProgress').textContent=`Exercise ${step.stretchNum+1} of ${total}`;
  document.getElementById('timerName').textContent=step.name;
  document.getElementById('timerWarning').textContent=step.warning?'⚠️ '+step.warning:'';
  document.getElementById('timerRepNote').textContent=step.repnote?'🎯 '+step.repnote:'';

  if(step.type==='announce'||step.type==='switch_announce'){
    const isSwitch=step.type==='switch_announce';
    document.getElementById('timerLabel').textContent=isSwitch?'SWITCH SIDES':'GET READY';
    document.getElementById('timerLabel').className='timer-label'+(isSwitch?' switch-mode':'');
    document.getElementById('timerDisplay').textContent='•••';
    document.getElementById('timerDisplay').className='timer-display'+(isSwitch?' switch-mode':'');
    document.getElementById('timerBreath').textContent='';
    document.getElementById('pbarFill').style.width='0%';
    speak(isSwitch?'Switch sides':step.name);
    const delay=isSwitch?5000:8000;
    setTimeout(()=>{ playStartBeeps(()=>{ stepIdx++; processStep(); }); },delay);

  } else if(step.type==='hold'){
    timeLeft=step.dur;
    document.getElementById('timerLabel').textContent='HOLD';
    document.getElementById('timerLabel').className='timer-label';
    document.getElementById('timerDisplay').textContent=timeLeft;
    document.getElementById('timerDisplay').className='timer-display';
    document.getElementById('timerBreath').textContent=step.breath?BREATH:'';
    document.getElementById('pbarFill').style.width='0%';
  }
}

// ─── TICK ─────────────────────────────────────────────────────────────────────
function tick() {
  const step=steps[stepIdx];
  if(!step||step.type==='announce'||step.type==='switch_announce') return;
  if(timeLeft<=3&&timeLeft>0) playCountdown();
  if(timeLeft<=1){
    stepIdx++;
    if(stepIdx>=steps.length){ finishSession(); return; }
    processStep(); return;
  }
  timeLeft--;
  document.getElementById('timerDisplay').textContent=timeLeft;
  if(step.dur) document.getElementById('pbarFill').style.width=(((step.dur-timeLeft)/step.dur)*100)+'%';
}

// ─── FINISH ───────────────────────────────────────────────────────────────────
function finishSession() {
  clearInterval(interval); running=false; releaseWakeLock();
  document.getElementById('doneOverlay').classList.add('show');
  playDone();
  setTimeout(()=>speak('All done. Great work.'),500);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
switchDay(currentDay);
</script>
